<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">

    <!-- Jumbotron -->
    <div class="p-5 mb-4 bg-light rounded-3">
      <div class="container-fluid py-3">
        <h1 class="display-6 fw-bold">Let's test the grid!</h1>
      </div>
    </div>

    <!-- Navbar (nav links) -->
    <ul class="nav mb-4">
      <li class="nav-item">
        <a class="nav-link active" href="#">Active</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>
      <li class="nav-item">
        <a class="nav-link disabled">Disabled</a>
      </li>
    </ul>

    <!-- Grid System -->
    <div class="container text-center mb-4">
      <!-- Hàng 1: chia đôi -->
       <table>
        
       </table>
      <div class="row mb-2" >
        <div class="col-6 bg-secondary bg-opacity-25 border">First col</div>
        <div class="col-6 bg-secondary bg-opacity-25 border">Second col</div>
      </div>

      <!-- Hàng 2: chia 3 -->
      <div class="row mb-2">
        <div class="col-4 bg-secondary bg-opacity-25 border">col</div>
        <div class="col-4 bg-secondary bg-opacity-25 border">col</div>
        <div class="col-4 bg-secondary bg-opacity-25 border">col</div>
      </div>

      <!-- Hàng 3: chia 4 -->
      <div class="row mb-2">
        <div class="col-3 bg-secondary bg-opacity-25 border">col</div>
        <div class="col-3 bg-secondary bg-opacity-25 border">col</div>
        <div class="col-3 bg-secondary bg-opacity-25 border">col</div>
        <div class="col-3 bg-secondary bg-opacity-25 border">col</div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-danger bg-opacity-10 text-center p-3 mt-4">
    <h3 class="m-0 fw-bold">Created by ABC!</h3>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
